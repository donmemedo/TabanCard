services:
  backend:
    build: ./backend
    ports: ["8049:8000"]
    environment: { DB_PATH: /data/khorshid.db, DEMO: "1" }
    volumes: [data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    environment: { BACKEND_URL: http://backend:8000 }
    ports: ["3049:3000"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  data:
